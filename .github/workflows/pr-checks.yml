# Name shown in the GitHub "Actions" tab
name: PR checks

# WHEN to run: every time a PR is opened or updated that targets "main"
on:
  pull_request:
    branches: [main]

# WHAT to run: 4 jobs. They run at the same time, each on its own fresh Linux machine
jobs:

  # ───────── Job 1: Unit tests ─────────
  unit-tests:
    name: Unit tests                     # this name shows on the PR
    runs-on: ubuntu-latest               # GitHub gives us a clean Ubuntu machine
    defaults:
      run:
        working-directory: apps/backend  # all "run" commands start in the backend folder
    steps:
      - uses: actions/checkout@v4        # 1) download the PR's code onto the machine
      - uses: actions/setup-java@v4      # 2) install Java 17 (the backend needs it)
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle                  #    reuse downloaded libraries → faster next time
      - name: Run unit tests             # 3) run only unit tests (from Step 2)
        run: |
          chmod +x gradlew
          ./gradlew test

  # ───────── Job 2: Integration tests ─────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run integration tests      # runs the @Tag("integration") tests (Spring + H2 DB)
        run: |
          chmod +x gradlew
          ./gradlew integrationTest

  # ───────── Job 3: E2E tests ─────────
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest

    # A real PostgreSQL database runs next to the job, the same as in production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4      # Node.js for the web/admin frontends + Playwright
        with:
          node-version: '22'

      # Same as the Dockerfile: build the admin app and put it inside the backend
      - name: Build admin into backend (/backoffice)
        working-directory: apps/admin
        run: |
          npm ci
          npm run build
          mkdir -p ../backend/src/main/resources/static/backoffice
          cp -r dist/. ../backend/src/main/resources/static/backoffice/
      - name: Start backend
        working-directory: apps/backend
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun > backend.log 2>&1 &

      # Check every 5 seconds (up to 5 minutes) until the backend answers "UP"
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health && exit 0
            sleep 5
          done
          echo "Backend did not start:"; cat apps/backend/backend.log; exit 1

      # Test the customer website
      - name: Web E2E tests
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      # Test the admin panel
      - name: Admin E2E tests
        working-directory: apps/admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      # If something failed, save the Playwright reports so you can download and inspect them
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: apps/*/playwright-report/

  # ───────── Job 4: Qodana static analysis ─────────
  qodana:
    name: Qodana static analysis
    runs-on: ubuntu-latest
    permissions:                         # lets Qodana post results/comments on the PR
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # the PR's latest commit
          fetch-depth: 0                                  # full history, so Qodana can see what changed
      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --project-dir,apps/backend                # analyze only the Java backend
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_828643796 }}   # the secret Qodana created for you
